name: Compilar Mod Host Only

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo fonte
      uses: actions/checkout@v4

    - name: Configurar .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Criar projeto C#
      run: |
        dotnet new classlib -o MeuModHostOnly -f net6.0 --force
        cp Plugin.cs MeuModHostOnly/Class1.cs

    - name: Adicionar repositório BepInEx e Pacotes
      run: |
        cd MeuModHostOnly
        dotnet nuget add source https://nuget.bepinex.dev/v3/index.json -n BepInEx
        dotnet add package BepInEx.Unity.IL2CPP --version 6.0.0-be.668
        dotnet add package HarmonyX --version 2.10.2

    - name: Compilar DLL
      run: |
        cd MeuModHostOnly
        dotnet build -c Release

    - name: Salvar DLL do Mod
      uses: actions/upload-artifact@v4
      with:
        name: HostOnly-DLL
        path: MeuModHostOnly/bin/Release/net6.0/*.dll
