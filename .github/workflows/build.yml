name: Compilar Mod Host Only

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo fonte
      uses: actions/checkout@v4

    - name: Configurar .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Criar projeto e injetar Plugin
      run: |
        dotnet new classlib -o ModProj -f net6.0 --force
        cp Plugin.cs ModProj/Plugin.cs
        rm ModProj/Class1.cs

    - name: Adicionar dependencias BepInEx e Harmony
      run: |
        cd ModProj
        dotnet add package HarmonyX --version 2.10.2
        dotnet add package BepInEx.Unity.IL2CPP --version 6.0.0-be.668 --source https://nuget.bepinex.dev/v3/index.json || true

    - name: Compilar Mod (.DLL)
      run: |
        cd ModProj
        dotnet build -c Release /p:AllowUnsafeBlocks=true

    - name: Salvar Artefato DLL
      uses: actions/upload-artifact@v4
      with:
        name: HostOnly-DLL
        path: ModProj/bin/Release/net6.0/*.dll
