name: Compilar Mod Host Only

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo fonte
      uses: actions/checkout@v4

    - name: Configurar .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Criar projeto C# e copiar Plugin
      run: |
        dotnet new classlib -o MeuModHostOnly -f net6.0
        cp Plugin.cs MeuModHostOnly/Class1.cs

    - name: Adicionar dependencias e compilar
      run: |
        cd MeuModHostOnly
        dotnet add package HarmonyX --version 2.10.2
        dotnet build -c Release

    - name: Salvar DLL do Mod
      uses: actions/upload-artifact@v4
      with:
        name: HostOnly-DLL
        path: MeuModHostOnly/bin/Release/net6.0/*.dll
