
name: Compilar Mod Host Only

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo fonte
        uses: actions/checkout@v4

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Criar projeto
        shell: bash
        run: |
          mkdir -p ModProj

          cat > ModProj/ModProj.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net6.0</TargetFramework>
              <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
              <LangVersion>latest</LangVersion>
            </PropertyGroup>

            <ItemGroup>
              <PackageReference Include="HarmonyX"
                                Version="2.10.2" />

              <PackageReference Include="BepInEx.Unity.IL2CPP"
                                Version="6.0.0-be.*" />

              <PackageReference Include="AmongUs.GameLibs"
                                Version="*-*" />
            </ItemGroup>
          </Project>
          EOF

          cat > ModProj/NuGet.Config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org"
                   value="https://api.nuget.org/v3/index.json" />
              <add key="BepInEx"
                   value="https://nuget.bepinex.dev/v3/index.json" />
            </packageSources>
          </configuration>
          EOF

          cp Plugin.cs ModProj/Plugin.cs

      - name: Restaurar dependencias
        run: |
          dotnet restore ModProj/ModProj.csproj --verbosity normal

      - name: Compilar Mod DLL
        run: |
          dotnet build ModProj/ModProj.csproj \
            -c Release --no-restore

      - name: Salvar Artefato DLL
        uses: actions/upload-artifact@v4
        with:
          name: HostOnly-DLL
          path: ModProj/bin/Release/net6.0/*.dll
          if-no-files-found: error
