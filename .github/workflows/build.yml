name: Compilar Mod Host Only

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo fonte
      uses: actions/checkout@v4

    - name: Configurar .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Criar projeto e compilar
      run: |
        dotnet new classlib -n MeuModHostOnly -f net6.0 --force
        cd MeuModHostOnly
        dotnet add package HarmonyX --version 2.10.2
        dotnet add package BepInEx.Core --version 6.0.0-be.668 --source https://nuget.bepinex.dev/v3/index.json || true
        cp ../Plugin.cs Class1.cs
        dotnet build -c Release

    - name: Salvar DLL do Mod
      uses: actions/upload-artifact@v4
      with:
        name: HostOnly-DLL
        path: MeuModHostOnly/bin/Release/net6.0/*.dll
